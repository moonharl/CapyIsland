<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://moonharl.github.io/CapyIsland/ER-32px.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="https://moonharl.github.io/CapyIsland/ER-16px.png" sizes="16x16" />
    <title>RESTRITO</title>

    <link rel="stylesheet" href="css/minenautica.css">
    <link rel="stylesheet" href="css/v.css">
    <script defer src="js/flash.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: sans-serif;
}
#game {
    position: relative;
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
}
#scene {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.hotspot {
    position: absolute;
    background: rgba(255, 0, 0, 0.25);
    border: 2px solid red; /* invisível */
    /* Para testar durante o desenvolvimento:
       background: rgba(255,0,0,0.25);
       border: 2px solid red; */
}
</style>
</head>
<body>

<div id="game">
    <img id="scene" src="" alt="Cena do jogo">
</div>

<script>
// =======================
// DEFINIÇÃO DAS CENAS
// =======================
const scenes = {
    inicio: {
        image: "https://i.imgur.com/Q7tUlIV.jpeg", // coloque a imagem na pasta "imagens"
        hotspots: [
            {x: 710, y: 330, width: 80, height: 80, target: "frente"}
        ]
    },
    frente: {
        image: "https://i.imgur.com/iFouJGW.jpeg",
        hotspots: [
            {x: 120, y: 300, width: 80, height: 80, target: "curva"}
        ]
    },
    curva: {
        image: "https://i.imgur.com/y4TEeEZ.jpeg",
        hotspots: [
            {x: 900, y: 250, width: 100, height: 80, target: "pilares"}
        ]
    },
    pilares: {
        image: "https://i.imgur.com/Yym6PJw.jpeg",
        hotspots: [
            {x: 760, y: 220, width: 80, height: 80, target: "null"},
            {x: 820, y: 560, width: 120, height: 80, target: "null"}
        ]
    },
};

// =======================
// MOTOR DO JOGO
// =======================
const game = document.getElementById("game");
const sceneImg = document.getElementById("scene");

function clearHotspots() {
    document.querySelectorAll(".hotspot").forEach(el => el.remove());
}

function loadScene(sceneName) {
    const scene = scenes[sceneName];
    if(!scene){
        console.error("Cena não encontrada:", sceneName);
        return;
    }

    sceneImg.src = scene.image;

    clearHotspots();

    scene.hotspots.forEach(h => {
        const btn = document.createElement("div");
        btn.className = "hotspot";
        btn.style.left = h.x + "px";
        btn.style.top = h.y + "px";
        btn.style.width = h.width + "px";
        btn.style.height = h.height + "px";
        btn.addEventListener("click", () => {
            loadScene(h.target);
        });
        game.appendChild(btn);
    });
}

// Cena inicial
loadScene("inicio");
</script>

</body>

</html>
