<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI Terminal</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: hsl(154 50% 5%);
  font-family: monospace;
  color: hsl(154 84% 70%);
  text-shadow: 0 0 4px hsl(154 84% 70%);
}

/* ===== PC EXTERNO ===== */
#pc {
  position: fixed;
  inset: 0;
  background-image: url('https://i.imgur.com/VP8m2Dc.png');
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}

/* ===== TELA DO PC FIXA ===== */
#pcScreen {
  position: absolute;
  width: 500px;
  height: 300px;

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  overflow: hidden;
}

/* ===== OVERLAY CRT ===== */
#overlay {
  position: absolute;
  inset: 0;
  background-image: url('https://i.imgur.com/LrwVL8R.jpeg');
  background-size: cover;
  mix-blend-mode: multiply;
  pointer-events: none;
  z-index: 5;
}

/* ===== HUD ===== */
#hud {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 10px;
  opacity: 0.7;
  z-index: 10;
}

/* ===== BOTÃO LIGAR ===== */
#telaInicial {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

#ligar {
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}

#ligar:hover {
  text-shadow: 0 0 10px hsl(154 84% 70%);
}

/* ===== TERMINAL ===== */
#terminal {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 460px;
  height: 260px;

  overflow-y: auto;
  white-space: pre-wrap;

  z-index: 15;
  display: none;
}

/* ===== CRT LINES ===== */
#interlaced {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    transparent 0px,
    rgba(0,0,0,0.25) 2px
  );
  pointer-events: none;
  z-index: 6;
}

/* ===== INTRO ASCII ===== */
.intro {
  font-size: 10px;
  line-height: 1.1;
  white-space: pre;
}
</style>
</head>

<body>

<div id="pc">
  <div id="pcScreen">

    <div id="overlay"></div>
    <div id="interlaced"></div>

    <div id="hud">
      TERMINAL-CI-LTS-ENT-1998-v.2.314.1
    </div>

    <!-- BOTÃO LIGAR -->
    <div id="telaInicial">
      <div id="ligar">ligar</div>
    </div>

    <!-- TERMINAL -->
    <div id="terminal"></div>

  </div>
</div>

<script>
const audio = new Audio("https://moonharl.github.io/CapyIsland/internal/src/lotus.mp3");
audio.volume = 0.9;

const telaInicial = document.getElementById("telaInicial");
const terminal = document.getElementById("terminal");

document.getElementById("ligar").addEventListener("click", () => {
  audio.play().catch(() => {});

  telaInicial.style.display = "none";
  terminal.style.display = "block";

  setTimeout(iniciarTerminal, 3000);
});

function iniciarTerminal() {
  terminal.innerHTML = "";
  boot();
}

/* ===== TYPE EFFECT ===== */
function typeText(text, callback) {
  let i = 0;

  function write() {
    if (i < text.length) {
      terminal.innerHTML += text[i];
      i++;
      terminal.scrollTop = terminal.scrollHeight;
      setTimeout(write, 12);
    } else {
      if (callback) callback();
    }
  }

  write();
}

/* ===== BOOT ===== */
function boot() {
  typeText(
`Inicializando sistema...
Carregando módulos...
Verificando integridade...

Acesso concedido.

Digite "help" para começar.

> `,
  ativarInput);
}

/* ===== INPUT ===== */
let buffer = "";

function ativarInput() {
  document.addEventListener("keydown", digitar);
}

function digitar(e) {
  if (!terminal) return;

  if (e.key === "Enter") {
    terminal.innerHTML += "\n";
    processarComando(buffer.trim());
    buffer = "";
    return;
  }

  if (e.key === "Backspace") {
    buffer = buffer.slice(0, -1);
    terminal.innerHTML = terminal.innerHTML.slice(0, -1);
    return;
  }

  if (e.key.length === 1) {
    buffer += e.key;
    terminal.innerHTML += e.key;
  }

  terminal.scrollTop = terminal.scrollHeight;
}

/* ===== COMANDOS ===== */
function processarComando(cmd) {
  switch(cmd) {

    case "help":
      typeText(`\nComandos:
- iniciar
- arquivos
- login
- clear\n\n> `);
      break;

    case "iniciar":
      typeText(`\nSistema secundário iniciado...\nErro: acesso limitado.\n\n> `);
      break;

    case "arquivos":
      typeText(`\nlog_001.txt
sistema.cfg
segredo.dat\n\n> `);
      break;

    case "login":
      pedirSenha();
      break;

    case "clear":
      terminal.innerHTML = "> ";
      break;

    case "segredo":
      typeText(`\n████ ACESSO OCULTO ████
Projeto CI_64 detectado...
"NÃO ERA PARA TER SIDO ABERTO"\n\n> `);
      break;

    default:
      typeText(`\nComando não reconhecido.\n\n> `);
  }
}

/* ===== SENHA ===== */
function pedirSenha() {
  typeText("\nDigite a senha: ", () => {
    let senha = "";

    function capturar(e) {

      if (e.key === "Enter") {
        document.removeEventListener("keydown", capturar);

        if (senha === "capy") {
          typeText("\nAcesso TOTAL concedido.\n\n> ");
        } else {
          typeText("\nSenha incorreta.\n\n> ");
        }

        ativarInput();
        return;
      }

      if (e.key === "Backspace") {
        senha = senha.slice(0, -1);
        terminal.innerHTML = terminal.innerHTML.slice(0, -1);
        return;
      }

      if (e.key.length === 1) {
        senha += e.key;
        terminal.innerHTML += "*";
      }
    }

    document.removeEventListener("keydown", digitar);
    document.addEventListener("keydown", capturar);
  });
}
</script>

</body>
</html>
